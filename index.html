<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My week">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>My week</title>
</head>
<body>
<main>
<header>
  <h1>My week</h1>
  <p class="sub" id="sub">Sample schedule</p>
  <nav class="tabs" aria-label="Views">
    <button class="tab on" data-tab="now">Now</button>
    <button class="tab" data-tab="week">Week</button>
  </nav>
</header>

<!-- NOW -->
<section id="view-now">
  <div class="two">
    <div class="card nowcard">
      <div class="top"><span id="badge">–</span><span id="when">–</span></div>
      <p id="act">–</p>
      <p id="where">–</p>
      <p id="left">–</p>
      <p id="rng" class="k">–</p>
      <div class="bar"><div id="prog"></div></div>
      <p class="k">Next up</p>
      <p id="next">–</p>
      <button id="backNow" hidden>← Back to now</button>
    </div>
    <div class="card mapcard">
      <div id="map" role="img" aria-label="Map of my current route"></div>
      <p id="eta">–</p>
    </div>
  </div>

  <details class="explore">
    <summary>Check another time</summary>
    <div class="row" id="days"></div>
    <div class="roller">
      <button id="play" aria-label="Play">▶</button>
      <input type="range" id="t" min="0" max="1435" step="5" value="600" aria-label="Time of day">
      <span id="clock">10:00</span>
    </div>
    <div id="strip"></div>
    <div class="ticks"><span>07</span><span>11</span><span>15</span><span>19</span><span>24</span></div>
  </details>
</section>

<!-- WEEK -->
<section id="view-week" hidden>
  <div class="metrics">
    <div class="metric"><p class="k">Free time</p><p class="v" id="mFree">–</p></div>
    <div class="metric"><p class="k">Study hours</p><p class="v" id="mStudy">–</p></div>
    <div class="metric"><p class="k">Class hours</p><p class="v" id="mClass">–</p></div>
    <div class="metric"><p class="k">Gym + sauna visits</p><p class="v" id="mGym">–</p></div>
  </div>
  <div class="row weekbar" id="weekdays" role="group" aria-label="Choose a day or the whole week"></div>
  <div class="legend" id="legend"></div>
  <div class="grid" id="grid"></div>
  <p id="detail">Tap a block to see details or edit it.</p>
  <div class="manage">
    <button id="addBlock">+ Add block</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import file</button>
    <button id="pasteBtn">Paste text</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button id="resetBtn">Reset</button>
  </div>
  <p id="storeNote" class="k"></p>
</section>

<dialog id="pasteDlg">
  <form id="pasteForm">
    <h3>Paste your schedule</h3>
    <label>Paste the text of your schedule file
      <textarea id="pasteText" rows="8" required spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    </label>
    <p id="pasteErr" class="err" role="alert"></p>
    <div class="btns">
      <span class="sp"></span>
      <button type="button" id="pasteCancel">Cancel</button>
      <button type="submit" class="primary">Import</button>
    </div>
  </form>
</dialog>

<dialog id="editor">
  <form id="edForm">
    <h3 id="edTitle">Edit block</h3>
    <label>Day <select id="edDay"></select></label>
    <div class="fields">
      <label>Start <input type="time" id="edStart" required></label>
      <label>End <input type="time" id="edEnd" required></label>
    </div>
    <label>Type <select id="edCat"></select></label>
    <label>Name <input type="text" id="edLabel" required maxlength="80"></label>
    <label id="edPlaceWrap">Place <select id="edPlace"></select></label>
    <div class="fields" id="edTripWrap">
      <label>From <select id="edFrom"></select></label>
      <label>To <select id="edTo"></select></label>
    </div>
    <p id="edErr" role="alert"></p>
    <div class="btns">
      <button type="button" id="edDelete" class="danger">Delete</button>
      <span class="sp"></span>
      <button type="button" id="edCancel">Cancel</button>
      <button type="submit" id="edSave" class="primary">Save</button>
    </div>
  </form>
</dialog>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
